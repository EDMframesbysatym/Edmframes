<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>edm.frames — Satyam Singh · Creative Artist</title>
<meta name="description" content="edm.frames by Satyam Singh. Moments captured on a phone, edited slowly, framed with feeling.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f4f2ee;--mute:#8d8a84;--line:#242424;--gold:#d2ad5a;--gold2:#8f6b22;--pad:clamp(18px,3.2vw,44px);--sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;--serif:"Instrument Serif",Georgia,"Times New Roman",serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{background:#000;-webkit-text-size-adjust:100%}
body{background:#000;color:var(--fg);font-family:var(--sans);font-weight:300;line-height:1.5;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ph{background:#111;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
em.s{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.02em}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500}
.rv{opacity:0;transform:translateY(34px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--d,0)*90ms)}
.rv.v{opacity:1;transform:none}

/* NAV */
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:14px var(--pad);pointer-events:none}
nav>*{pointer-events:auto}
.logo{display:block;width:54px}.logo img{width:100%}
.pill{display:flex;gap:2px;background:rgba(16,16,16,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #2c2c2c;border-radius:99px;padding:3px}
.pill a{padding:8px 16px;border-radius:99px;font-size:13px;font-weight:500;transition:background .35s,color .35s}
.pill a.on,.pill a:hover{background:var(--fg);color:#000}
.ig{width:54px;text-align:right;font-size:12px;font-weight:500;white-space:nowrap}
.ig span{display:inline-block;padding:8px 14px;border-radius:99px;background:#232323;transition:background .3s,color .3s}
.ig:hover span{background:var(--gold);color:#000}
@media(min-width:900px){.ig{width:auto}}
@media(max-width:899px){.ig{display:none}.logo{width:46px}}
@media(max-width:560px){.pill a{padding:8px 11px;font-size:12px}}

/* HERO */
.hero{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden}
.hero-in{position:absolute;inset:0;will-change:transform,opacity}
.mw{position:absolute;left:1.4vw;right:0;bottom:0;height:.8em;font-size:18.2vw;line-height:.8;overflow:hidden;font-weight:800;letter-spacing:-.07em;white-space:nowrap}
.mw span{display:inline-block;transform:translateY(105%);animation:rise 1.25s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(.15s + var(--i)*70ms)}
.mw .br{display:none}
@keyframes rise{to{transform:none}}
.sm{position:absolute;top:84px;font-size:13px;color:var(--mute);max-width:17ch;opacity:0;animation:fade 1s ease forwards}
.sm b{display:block;color:var(--fg);font-weight:500}
@keyframes fade{to{opacity:1}}
.cta{position:absolute;right:var(--pad);top:84px;font-size:12px;font-weight:500;background:#232323;border-radius:99px;padding:7px 15px;opacity:0;animation:fade 1s 1.2s ease forwards;transition:background .3s,color .3s}
.cta:hover{background:var(--gold);color:#000}
.tag{position:absolute;right:var(--pad);bottom:calc(.8*18.2vw + 20px);width:min(34vw,430px);font-size:clamp(16px,1.7vw,25px);font-weight:500;line-height:1.1;letter-spacing:-.03em;opacity:0;animation:fade 1s 1.5s ease forwards}
.feat{position:absolute;left:7vw;top:14svh;height:min(72svh,100vw);aspect-ratio:3/4;border-radius:clamp(16px,2vw,28px);transform-origin:0 0;opacity:0;box-shadow:0 40px 90px rgba(0,0,0,.7);animation:feat 16.8s cubic-bezier(.65,0,.25,1) infinite;animation-delay:calc(1.3s + var(--i)*4.2s);z-index:5}
@keyframes feat{
 0%{opacity:0;transform:translate(0,40svh) scale(.12) rotate(-10deg)}2%{opacity:1}
 6%{transform:translate(2vw,28svh) scale(.2) rotate(-5deg)}
 13%,19%{transform:translate(8vw,0) scale(1) rotate(0);opacity:1}
 24%{transform:translate(48vw,6svh) scale(.22) rotate(8deg);opacity:1}
 25%,100%{opacity:0;transform:translate(60vw,10svh) scale(.1)}}
@keyframes featm{
 0%{opacity:0;transform:translateY(30svh) scale(.12) rotate(-8deg)}2%{opacity:1}
 6%{transform:translateY(22svh) scale(.22) rotate(-4deg)}
 13%,19%{transform:none;opacity:1}
 24%{transform:translate(34vw,-4svh) scale(.2) rotate(8deg);opacity:1}
 25%,100%{opacity:0;transform:scale(.1)}}
.th{position:absolute;width:clamp(60px,8.5vw,140px);aspect-ratio:1;border-radius:14px;z-index:4;opacity:0;animation:pop .9s cubic-bezier(.16,1,.3,1) forwards,bob 6s ease-in-out infinite alternate;animation-delay:calc(1.6s + var(--i)*.18s),calc(3s + var(--i)*.4s)}
@keyframes pop{from{opacity:0;transform:translateY(60px) scale(.5)}to{opacity:1;transform:none}}
@keyframes bob{to{translate:0 -14px}}
@media(max-width:700px){
 .mw{left:var(--pad);height:1.6em;font-size:27vw;white-space:normal}.mw .br{display:block;width:100%;height:0}
 .tag{left:var(--pad);right:auto;width:68vw;bottom:calc(1.6*27vw + 18px);font-size:17px}
 .sm,.cta{display:none}.sm{left:var(--pad)!important;top:76px}
 .feat{height:44svh;left:50%;top:16svh;translate:-50% 0;transform-origin:50% 50%;animation-name:featm}
}

/* PINNED */
.pin{position:relative}.pin>.in{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.story{height:380svh}
.story h2{position:absolute;left:var(--pad);top:50%;transform:translateY(-52%);font-size:clamp(44px,11.4vw,230px);font-weight:500;line-height:.92;letter-spacing:-.06em}
.story h2 span{display:block;will-change:transform,filter,opacity}
.story h2 em.s{font-size:1.06em}
.story .cap{position:absolute;left:var(--pad);bottom:34px;font-size:13px;color:var(--mute);max-width:26ch}
.story .cap2{left:auto;right:var(--pad);text-align:right}
.fan{position:absolute;left:0;top:0;aspect-ratio:3/4;border-radius:clamp(14px,1.6vw,24px);will-change:transform;box-shadow:0 30px 70px rgba(0,0,0,.65)}
@media(max-width:700px){.story{height:320svh}.story h2{top:15svh;transform:none;font-size:17vw}.story .cap{bottom:24px;max-width:20ch}.story .cap2{display:none}}

/* WALL */
.wallsec{height:300svh}
.stage{position:absolute;inset:0;perspective:1100px;overflow:hidden}
.rows{position:absolute;left:-10vw;right:-10vw;top:-8svh;transform:rotateX(16deg) scale(1.12);transform-origin:50% 40%;display:flex;flex-direction:column;gap:1.1vw}
.row{display:flex;gap:1.1vw;width:max-content;will-change:transform}
.tile{height:25svh;aspect-ratio:var(--ar,3/4);border-radius:12px;transition:opacity .6s,filter .6s}
.tile.dim{opacity:.1;filter:grayscale(1)}
.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 58% 42% at 50% 48%,rgba(0,0,0,.92),rgba(0,0,0,.6) 62%,transparent 100%),linear-gradient(#000 0,transparent 16%,transparent 72%,#000 100%)}
.wc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.wc h3{font-size:clamp(30px,5.4vw,92px);font-weight:500;letter-spacing:-.05em;line-height:.95;max-width:12ch}
.wc p{color:#c4c1bb;font-size:clamp(13px,1.1vw,16px);max-width:34ch;margin:14px 0 22px}
.bar{display:flex;align-items:center;gap:10px;background:rgba(20,20,20,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #333;border-radius:99px;padding:6px 6px 6px 22px;width:min(540px,88vw)}
.bar span{flex:1;text-align:left;color:#9a9a9a;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--fg);color:#000;font-weight:500;font-size:14px;border-radius:99px;padding:12px 22px;transition:transform .3s,background .3s}
.btn:hover{transform:scale(1.05);background:var(--gold)}.btn svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;max-width:90vw}
.chips button{font:500 12.5px var(--sans);color:var(--fg);background:rgba(24,24,24,.9);border:1px solid #333;border-radius:99px;padding:8px 16px;cursor:pointer;transition:background .3s,color .3s}
.chips button.on,.chips button:hover{background:var(--fg);color:#000}
@media(max-width:700px){.wallsec{height:240svh}.tile{height:17svh}.rows,.row{gap:2vw}.wc h3{font-size:9vw}.wc p{font-size:13px;max-width:30ch}.shade{background:radial-gradient(ellipse 85% 50% at 50% 50%,rgba(0,0,0,.94),rgba(0,0,0,.7) 65%,transparent 100%),linear-gradient(#000 0,transparent 14%,transparent 76%,#000 100%)}}

/* ABOUT */
.about{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(30px,7vw,120px);padding:clamp(90px,14vw,210px) var(--pad)}
.about h2{font-size:clamp(52px,9.4vw,170px);font-weight:500;letter-spacing:-.06em;line-height:.9;margin:18px 0 6px}
.role{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.6vw,38px);color:var(--gold);margin-bottom:clamp(26px,4vw,50px)}
.about p{font-size:clamp(16px,1.35vw,20px);color:#cfccc6;max-width:46ch;margin-bottom:1.1em;line-height:1.6}
.about p strong{color:var(--fg);font-weight:500}
.mg{display:inline-block;margin-top:10px;font-size:13px;border:1px solid #333;border-radius:99px;padding:9px 18px;color:var(--fg)}
.mg b{color:var(--gold);font-weight:500}
.ab-r{display:flex;flex-direction:column;gap:22px}
.ab-r .ph{border-radius:20px;aspect-ratio:4/5}
.steps{list-style:none;border-top:1px solid var(--line)}
.steps li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);font-size:clamp(18px,1.8vw,26px);font-weight:500;letter-spacing:-.02em}
.steps li span{color:var(--mute);font-size:13px;font-weight:300;letter-spacing:0;text-align:right}
@media(max-width:800px){.about{grid-template-columns:1fr}}

/* CREATORS */
.cr{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,6vw,100px);align-items:center;padding:clamp(70px,10vw,150px) var(--pad)}
.cr h2{font-size:clamp(40px,7vw,120px);font-weight:500;letter-spacing:-.055em;line-height:.92}
.cr p{color:var(--mute);max-width:32ch;margin-top:20px}
.cm{border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(210,173,90,.14);transition:transform 1.1s cubic-bezier(.16,1,.3,1),opacity 1s}
.cm.rv{transform:rotate(3deg) translateY(30px)}.cm.rv.v{transform:rotate(-2deg)}.cm.rv.v:hover{transform:rotate(0) scale(1.03)}
@media(max-width:800px){.cr{grid-template-columns:1fr}}

/* CONTACT */
.ct{padding:clamp(80px,12vw,180px) var(--pad);border-top:1px solid var(--line)}
.ct h2{font-size:clamp(44px,9vw,160px);font-weight:500;letter-spacing:-.06em;line-height:.9;max-width:11ch}
.ct-g{display:grid;grid-template-columns:1.3fr .7fr;gap:clamp(30px,6vw,100px);margin-top:clamp(36px,6vw,80px);align-items:start}
.lk{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;border-top:1px solid var(--line);transition:padding .4s,color .3s}
.lk:last-child{border-bottom:1px solid var(--line)}
.lk small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.lk b{font-weight:500;font-size:clamp(18px,2.4vw,34px);letter-spacing:-.03em;word-break:break-word}
.lk i{font-style:normal;font-size:24px;transition:transform .4s;color:var(--gold)}
.lk:hover{padding-left:12px;color:var(--gold)}.lk:hover i{transform:translateX(6px)}
.lg{background:#f5f7fc;border-radius:20px;padding:10px;overflow:hidden}.lg img{width:100%;border-radius:12px}
@media(max-width:800px){.ct-g{grid-template-columns:1fr}}

/* FOOTER */
footer{padding:0 var(--pad) calc(26px + env(safe-area-inset-bottom,0px));overflow:hidden}
.big{font-weight:800;font-size:18.4vw;line-height:.82;letter-spacing:-.07em;background:linear-gradient(90deg,var(--gold2),var(--gold) 55%,#f1d890);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.1em}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;border-top:1px solid var(--line);padding-top:18px;font-size:14px;color:var(--mute)}
.foot b{color:var(--fg);font-weight:500}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.mw span,.sm,.cta,.tag,.th{opacity:1;transform:none}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="#top" aria-label="edm.frames home"><img src="assets/mark.png" alt="edm.frames logo"></a>
  <div class="pill" id="pill"><a href="#top" class="on">Home</a><a href="#wall">Frames</a><a href="#about">About</a><a href="#contact">Contact</a></div>
  <a class="ig" href="#" data-ig target="_blank" rel="noopener"><span>@edm.frames</span></a>
</nav>

<header class="hero" id="top"><div class="hero-in" id="heroIn">
  <div id="feats"></div><div id="ths"></div>
  <div class="sm s1" style="left:var(--pad);animation-delay:1s"><b data-t="hero.s1t"></b><span data-t="hero.s1d"></span></div>
  <div class="sm s2" style="left:26vw;animation-delay:1.15s"><b data-t="hero.s2t"></b><span data-t="hero.s2d"></span></div>
  <div class="sm s3" style="left:46vw;animation-delay:1.3s"><b data-t="hero.s3t"></b><span data-t="hero.s3d"></span></div>
  <a class="cta" href="#" data-ig target="_blank" rel="noopener">Follow on Instagram</a>
  <p class="tag" data-t="hero.tag"></p>
  <h1 class="mw" id="mw" aria-label="edm.frames"></h1>
</div></header>

<section class="pin story" id="story"><div class="in">
  <h2 id="sh"><span data-t="story.l1"></span><span><em class="s" data-t="story.l2"></em></span><span data-t="story.l3"></span></h2>
  <p class="cap" data-t="story.cap1"></p>
  <p class="cap cap2" data-t="story.cap2"></p>
  <div id="fan"></div>
</div></section>

<section class="pin wallsec" id="wall"><div class="in">
  <div class="stage"><div class="rows" id="rows"></div></div>
  <div class="shade"></div>
  <div class="wc">
    <h3 data-t="wall.title"></h3>
    <p data-t="wall.text"></p>
    <div class="bar"><span id="igtxt"></span>
      <a class="btn" href="#" data-ig target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor"/></svg>Follow</a></div>
    <div class="chips" id="chips"></div>
  </div>
</div></section>

<section class="about" id="about">
  <div>
    <p class="eyebrow rv" data-t="about.eyebrow"></p>
    <h2 class="rv" style="--d:1;white-space:pre-line" data-t="about.name"></h2>
    <p class="role rv" style="--d:2" data-t="about.role"></p>
    <div id="abp"></div>
    <span class="mg rv" style="--d:4" data-t="about.managed"></span>
  </div>
  <div class="ab-r">
    <div class="rv" id="abimg" style="--d:2"></div>
    <ul class="steps rv" style="--d:3" id="steps"></ul>
  </div>
</section>

<section class="cr" id="creators">
  <div><h2 class="rv"><span data-t="creators.t1"></span><br><em class="s" data-t="creators.t2"></em></h2><p class="rv" style="--d:1" data-t="creators.text"></p></div>
  <div class="cm rv" id="cm"><img id="cmimg" src="" alt="Instagram comment from a verified account"></div>
</section>

<section class="ct" id="contact">
  <p class="eyebrow rv">Contact</p>
  <h2 class="rv" style="--d:1"><span data-t="contact.t1"></span> <em class="s" data-t="contact.t2"></em></h2>
  <div class="ct-g">
    <div>
      <div id="links"></div>
    </div>
    <div class="lg rv" style="--d:2"><img src="assets/logo.jpg" alt="EDM Frames logo"></div>
  </div>
</section>

<footer>
  <div class="big">edm.frames</div>
  <div class="foot"><span id="fm"></span><a href="#" data-ig target="_blank" rel="noopener">Instagram</a><span id="fd"></span></div>
</footer>

<script>
function start(C){
const IM=C.frames.map(f=>({s:f.src,t:f.cat,a:f.alt}));
const N=IM.length;let FE=IM.map((_,i)=>i).filter(i=>C.frames[i].featured).slice(0,4);for(let i=0;FE.length<Math.min(4,N)&&i<N;i++)if(!FE.includes(i))FE.push(i);
const TH=IM.map((_,i)=>i).filter(i=>!FE.includes(i)).slice(0,5);const FAN=[...Array(Math.min(10,N))].map((_,i)=>(i*3+1)%N);
const $=s=>document.querySelector(s);
const M=innerWidth<700;
const ph=(i,cls='')=>{const d=document.createElement('div');d.className='ph '+cls;d.innerHTML=`<img src="${IM[i].s}" alt="${IM[i].a}" decoding="async">`;return d};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>t*t*(3-2*t);

[...'edm.frames'].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.setProperty('--i',i);$('#mw').appendChild(s);if(i===3){const b=document.createElement('span');b.className='br';$('#mw').appendChild(b)}});
FE.forEach((n,i)=>{const d=ph(n,'feat');d.style.setProperty('--i',i);$('#feats').appendChild(d)});
(M?[[16,'7vw','58svh'],[10,'76vw','56svh'],[3,'86vw','44svh']]:[[16,'58vw','22svh'],[10,'67vw','35svh'],[3,'79vw','24svh'],[14,'72vw','10svh'],[12,'88vw','36svh']]).forEach(([n,l,t],i)=>{const d=ph(TH[i%TH.length]||0,'th');d.style.cssText=`left:${l};top:${t};--i:${i}`;$('#ths').appendChild(d)});
const fans=FAN.map(n=>{const d=ph(n,'fan');$('#fan').appendChild(d);return d});
{const d=document.createElement('div');d.className='ph';d.style.cssText='border-radius:20px;aspect-ratio:4/5';const im=document.createElement('img');im.src=C.about.image;im.alt='';d.appendChild(im);$('#abimg').appendChild(d)}

const rows=[];
for(let r=0;r<(M?5:4);r++){const row=document.createElement('div');row.className='row';
  for(let k=0;k<(M?12:16);k++){const n=(k*3+r*5)%IM.length;const t=ph(n,'tile');t.dataset.t=IM[n].t;t.style.setProperty('--ar',(k+r)%4==0?'1/1':(k+r)%3==0?'4/5':'3/4');row.appendChild(t)}
  $('#rows').appendChild(row);rows.push(row)}
['All',...C.categories].forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;if(!i)b.className='on';b.onclick=()=>{document.querySelectorAll('.chips button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('dim',t!=='All'&&x.dataset.t!==t))};$('#chips').appendChild(b)});

const g=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=g(C,e.dataset.t)??'');
const S=C.site,ig='https://www.instagram.com/'+S.instagram;
document.querySelectorAll('[data-ig]').forEach(a=>a.href=ig);$('#igtxt').textContent='instagram.com/'+S.instagram;$('#cmimg').src=C.creators.image;
C.about.p.forEach((x,i)=>{const p=document.createElement('p');p.className='rv';p.style.setProperty('--d',3+(i>1));p.textContent=x;$('#abp').appendChild(p)});
C.about.steps.forEach(s=>{const l=document.createElement('li');l.append(s.t);const sp=document.createElement('span');sp.textContent=s.d;l.append(sp);$('#steps').appendChild(l)});
[['mailto:'+S.email,'Email',S.email],['tel:+'+S.phone,'Phone',S.phoneShow],['https://wa.me/'+S.phone,'WhatsApp','Message '+C.about.name.split('\n')[0]],[ig,'Instagram','@'+S.instagram],[S.facebookUrl||'https://www.facebook.com/search/top?q='+encodeURIComponent(S.facebookName),'Facebook',S.facebookName]].forEach(([h,l,v],i)=>{
 const a=document.createElement('a');a.className='lk rv';a.href=h;if(h.startsWith('http'))a.target='_blank',a.rel='noopener';
 a.innerHTML='<span><small></small><b></b></span><i>→</i>';a.querySelector('small').textContent=l;a.querySelector('b').textContent=v;$('#links').appendChild(a)});
const mk=(id,pre,v)=>{const e=$(id);e.append(pre+' ');const b=document.createElement('b');b.textContent=v;e.append(b)};
mk('#fm','Managed by',C.footer.managed);mk('#fd','Designed by',C.footer.designed);
const story=$('#story'),wall=$('#wall'),heroIn=$('#heroIn'),sh=[...$('#sh').children];
const secs=['top','wall','about','contact'].map(id=>document.getElementById(id));
const links=[...document.querySelectorAll('#pill a')];let act=-1;
let cur=scrollY;
const prog=(el,y)=>clamp((y-el.offsetTop)/(el.offsetHeight-innerHeight));
function frame(){
  const vw=innerWidth,vh=innerHeight,k=M?.28:.085;
  cur+=(scrollY-cur)*k;if(Math.abs(scrollY-cur)<.2)cur=scrollY;
  const hp=clamp(cur/vh);heroIn.style.transform=`translateY(${hp*8}vh) scale(${1-hp*.04})`;heroIn.style.opacity=1-hp*.9;
  const p=prog(story,cur);
  sh.forEach((s,i)=>{const t=ease(clamp((p-.03-i*.07)/.16));s.style.opacity=t;s.style.filter=`blur(${(1-t)*(M?10:18)}px)`;s.style.transform=`translateY(${(1-t)*40}px)`});
  const cw=M?vw*.5:Math.max(150,vw*.22),ch=cw*4/3;
  fans.forEach((f,i)=>{
    const t=ease(clamp((p-.1-i*.06)/.5));
    const x=(1.08*vw)-t*(1.08*vw+cw*1.2);
    const y=M?vh*.52+Math.sin(i*2.1)*vh*.06:(vh-ch)/2+Math.sin(i*2.1)*vh*.2;
    f.style.width=cw+'px';
    f.style.transform=`translate(${x}px,${y}px) rotate(${(1-t)*10-5+Math.sin(i)*4}deg) scale(${.9+t*.15})`;f.style.zIndex=i});
  const wp=prog(wall,cur);
  rows.forEach((r,i)=>{r.style.transform=`translateX(${(i%2?1:-1)*(wp-.5)*vw*.9-(i%2?0:vw*.35)}px)`});
  let a=0;secs.forEach((s,i)=>{if(cur+vh*.45>=s.offsetTop)a=i});
  if(a!==act){act=a;links.forEach((l,i)=>l.classList.toggle('on',i===a))}
  requestAnimationFrame(frame)}
frame();

const io=new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('v');o.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
links.forEach(l=>l.addEventListener('click',e=>{e.preventDefault();const t=document.querySelector(l.getAttribute('href'));scrollTo({top:t.offsetTop,behavior:'smooth'})}));
}
